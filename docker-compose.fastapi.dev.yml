version: '3.8'

services:
  fastapi:
    image: wonjun0120/nebula-ai:latest
    container_name: fastapi-dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - rabbitmq
      - redis
    volumes:
      - /mnt/fastapi:/app/data 

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-dev
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:alpine
    container_name: redis-dev
    ports:
      - "6379:6379"
