version: '3.8'

services:
  # Redis - 캐시 및 Celery 백엔드 (로컬 개발용)
  redis:
    image: redis:7-alpine
    container_name: nebula-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - REDIS_PASSWORD=dev_password_123
    mem_limit: 512m

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: nebula-ai:latest
    container_name: nebula-ai-dev
    restart: unless-stopped
    command: pipenv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://:dev_password_123@redis:6379/0

  celery_worker:
    image: nebula-ai:latest
    container_name: celery_worker-dev
    restart: unless-stopped
    command: pipenv run celery -A app.core.celery_worker worker --loglevel=info -Q bookmark_save,user_profile,user_analysis,recommendations,analytics,monitoring,clustering --concurrency=4
    env_file:
      - .env
    volumes:
      - ./app:/app/app
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://:dev_password_123@redis:6379/0

  celery_beat:
    image: nebula-ai:latest
    container_name: celery_beat-dev
    restart: unless-stopped
    command: pipenv run celery -A app.core.celery_worker beat --loglevel=info
    env_file:
      - .env
    volumes:
      - ./app:/app/app
    depends_on:
      celery_worker:
        condition: service_started
    environment:
      - REDIS_URL=redis://:dev_password_123@redis:6379/0

  flower:
    image: mher/flower:latest
    container_name: flower-dev
    restart: unless-stopped
    environment:
      - FLOWER_PORT=5555
      - CELERY_BROKER_URL=pyamqp://${RABBITMQ_USERNAME:-guest}:${RABBITMQ_PASSWORD:-guest}@${RABBITMQ_HOST:-15.165.20.194}:${RABBITMQ_PORT:-5672}//
      - CELERY_RESULT_BACKEND=redis://:dev_password_123@redis:6379/0
      - FLOWER_BASIC_AUTH=admin:admin123
    env_file:
      - .env
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  redis_dev_data:
    driver: local
