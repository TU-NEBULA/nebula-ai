version: '3.8'

services:
  web:
    image: wonjun0120/nebula-ai
    container_name: nebula-ai
    restart: always
    command: pipenv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - /mnt/extra/chroma_db:/app/chroma_db 

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      retries: 5
      start_period: 10s

  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
      start_period: 10s

  celery_worker:
    image: wonjun0120/nebula-ai
    container_name: celery_worker
    command: pipenv run celery -A app.core.celery_worker worker --loglevel=info -Q embedding
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - /mnt/extra/chroma_db:/app/chroma_db

  flower:
    image: mher/flower
    container_name: flower
    restart: always
    environment:
      - FLOWER_PORT=5555
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "5555:5555"

volumes:
  rabbitmq_data:
