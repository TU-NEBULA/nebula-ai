# pytest.ini
[tool:pytest]
minversion = 6.0
addopts = 
    -ra
    --strict-markers
    --strict-config
    --disable-warnings
    --tb=short
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    asyncio: marks tests as async
    integration: marks tests as integration tests
    performance: marks tests as performance tests
    unit: marks tests as unit tests
    slow: marks tests as slow running
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::RuntimeWarning:httpx._client
    ignore::pytest.PytestDeprecationWarning
    # 이벤트 루프 관련 경고 필터링 (Celery 및 asyncio 호환성 문제)
    ignore::RuntimeWarning:Event loop is closed
    ignore::RuntimeError:Event loop is closed
    ignore:There is no current event loop:DeprecationWarning
    ignore:.*coroutine.*was never awaited:RuntimeWarning
    # SQLAlchemy 관련 경고 필터링
    ignore::sqlalchemy.exc.SAWarning
    ignore:.*PostgreSQL.*:UserWarning
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
