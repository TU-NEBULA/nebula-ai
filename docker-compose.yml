version: '3.8'

services:
  web:
    build: .
    container_name: nebula-ai
    restart: always
    command: pipenv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app  # 로컬 app 디렉토리를 컨테이너에 마운트
    env_file:
      - .env
    cap_add:              # ptrace 허용
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    depends_on:
      - redis

  celery_worker:
    build: .
    container_name: celery_worker
    command: pipenv run celery -A app.core.celery_worker worker --loglevel=info -Q bookmark_save,user_profile,user_analysis,recommendations,analytics,monitoring
    volumes:
      - ./app:/app/app  # 로컬 app 디렉토리를 컨테이너에 마운트
    env_file:
      - .env
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf

  flower:
    image: mher/flower
    container_name: flower
    restart: always
    environment:
      - FLOWER_PORT=5555
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USERNAME:-guest}:${RABBITMQ_PASSWORD:-guest}@${RABBITMQ_HOST:-localhost}:${RABBITMQ_PORT:-5672}//
    env_file:
      - .env
    ports:
      - "5555:5555"
    depends_on:
      - redis

  # py-spy 프로파일링 전용 사이드카 컨테이너
  profiler:
    image: python:3.11-slim
    container_name: nebula-profiler
    pid: "host"           # 호스트 PID 네임스페이스 공유
    privileged: true      # ptrace 가능
    volumes:
      - ./profiles:/profiles
    profiles:
      - profiling         # 프로파일링 시에만 실행
    command: >
      bash -c "
      pip install py-spy &&
      py-spy --help
      "

volumes:
  redis_data:
