version: '3.8'

services:
  web:
    image: wonjun0120/nebula-ai
    container_name: nebula-ai
    restart: always
    build:
      context: ./
      dockerfile: Dockerfile
    command: pipenv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - chroma:/app/chroma
    depends_on:
      - rabbitmq

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"     
      - "15672:15672"   
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  chroma:
  rabbitmq_data:
